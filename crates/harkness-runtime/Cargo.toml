[package]
name = "harkness-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
# ADR-0009 points this edge one way only: the runtime is the composition point
# and may name an adapter, while no adapter may name the runtime. The agent
# registry needs both the run store and the ACP handshake, and trust has to
# compose with `trust` and `policy`, which an adapter cannot see — so the
# registry lives here and reaches down rather than the other way round.
harkness-acp.workspace = true
harkness-core.workspace = true
harkness-context.workspace = true
harkness-git.workspace = true
jsonschema.workspace = true
regex.workspace = true
rusqlite.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
harkness-test-fixtures.workspace = true
