[package]
name = "harkness-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "harkness-gui"
path = "src/main.rs"

[[test]]
name = "qml_smoke"
path = "tests/qml_smoke.rs"
harness = false

[[test]]
name = "run_surfaces"
path = "tests/run_surfaces.rs"
harness = false

[[test]]
name = "default_branch_push_repro"
path = "tests/default_branch_push_repro.rs"
harness = false

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
harkness-core.workspace = true
harkness-git.workspace = true
harkness-runtime.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[dev-dependencies]
git2.workspace = true
tempfile.workspace = true
time.workspace = true
