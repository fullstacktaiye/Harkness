[package]
name = "harkness-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "harkness"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
harkness-core.workspace = true
harkness-git.workspace = true
harkness-runtime.workspace = true
tracing.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
git2.workspace = true
# The mock-agent process scenarios name bare executables the fixture harness
# installs as links to the running integration-test binary. Dev-only.
harkness-test-fixtures.workspace = true
serde_json.workspace = true
# Splits the commands `tests/docs.rs` lifts out of README.md and docs/ the way a
# POSIX shell would quote them. Dev-only: nothing in the product parses a
# command line it did not construct itself.
shlex.workspace = true
tempfile.workspace = true
