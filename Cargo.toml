[workspace]
members = [
    "crates/harkness-test-fixtures",
    "crates/harkness-git",
    "crates/harkness-core",
    "crates/harkness-runtime",
    "crates/harkness-cli",
    "crates/harkness-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fullstacktaiye/harkness"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0"
git2 = { version = "0.21", default-features = false }
harkness-core = { path = "crates/harkness-core" }
harkness-git = { path = "crates/harkness-git" }
harkness-runtime = { path = "crates/harkness-runtime" }
harkness-test-fixtures = { path = "crates/harkness-test-fixtures" }
jsonschema = { version = "0.49", default-features = false }
libc = "0.2"
libgit2-sys = { version = "0.18", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_path_to_error = "0.1"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-human-readable", "serde-well-known"] }
uuid = { version = "1.24", features = ["serde", "v4", "v5"] }
