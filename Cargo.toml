[workspace]
members = [
    "crates/harkness-test-fixtures",
    "crates/harkness-git",
    "crates/harkness-core",
    "crates/harkness-context",
    "crates/harkness-acp",
    "crates/harkness-mcp",
    "crates/harkness-forge",
    "crates/harkness-recipe",
    "crates/harkness-runtime",
    "crates/harkness-cli",
    "crates/harkness-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fullstacktaiye/harkness"

[workspace.dependencies]
# ADR-0010 adopts the official ACP schema artifacts rather than hand-rolled
# serde, pinned to a schema/v1 release. ADR-0014 fixes protocol version 1, so
# every `unstable_*` feature stays off — `unstable_protocol_v2` above all, which
# is why default features are named explicitly here rather than inherited.
# `harkness-acp` takes this up in #149; nothing depends on it yet.
agent-client-protocol-schema = { version = "1.6", default-features = false }
base64 = "0.22"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0"
git2 = { version = "0.21", default-features = false }
harkness-acp = { path = "crates/harkness-acp" }
harkness-context = { path = "crates/harkness-context" }
harkness-forge = { path = "crates/harkness-forge" }
harkness-mcp = { path = "crates/harkness-mcp" }
harkness-recipe = { path = "crates/harkness-recipe" }
harkness-core = { path = "crates/harkness-core" }
harkness-git = { path = "crates/harkness-git" }
harkness-runtime = { path = "crates/harkness-runtime" }
harkness-test-fixtures = { path = "crates/harkness-test-fixtures" }
jsonschema = { version = "0.49", default-features = false }
libc = "0.2"
libgit2-sys = { version = "0.18", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
shlex = "2.0.1"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-human-readable", "serde-well-known"] }
uuid = { version = "1.24", features = ["serde", "v4", "v5"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
