name: Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
      # Clippy covers the whole workspace, and harkness-gui's build script
      # drives qmake, moc and qmltyperegistrar, so Qt 6 has to be present even
      # though nothing here links or runs the GUI.
      - name: Install Qt 6 development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      # A key distinct from the `core` job's, so two different Cargo profiles
      # do not overwrite each other's cache on every run.
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check runtime documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p harkness-runtime --no-deps
      # harkness-context denies undocumented public items, so a missing rustdoc
      # comment has to fail here rather than at the next crate that reads it.
      - name: Check context documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p harkness-context --no-deps
      # The transport crate's rustdoc *is* the contract #149 and #157 are written
      # against — the meaning of every `SpawnSpec` field, the connection
      # lifecycle, and what each error kind is triggered by — so an undocumented
      # public item has to fail here rather than at the adapter that reads it.
      - name: Check transport documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p harkness-transport --no-deps
      # ADR-0002 fixes the model-provider, native-agent and external-coding-agent
      # vocabulary in rustdoc and in naming, which is weaker than a type check
      # and is therefore worth failing a build over: an undocumented public item
      # on this boundary is the one #125 and #126 are written against.
      - name: Check provider documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p harkness-provider --no-deps

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test core
        run: cargo test --locked -p harkness-core
      - name: Test Git
        run: cargo test --locked -p harkness-git
      # The context engine earned a matrix entry when it grew a second SQLite
      # store. Its cache lifecycle renames and unlinks a database that was open
      # a moment earlier, which Windows refuses while a handle is held, and it
      # re-executes the test binary as a second process to prove two front ends
      # can share one cache. It now walks a real filesystem too, where the
      # answers that differ per platform are exactly the ones the walk depends
      # on: whether two names differing only by case are two files, and what a
      # directory listing hands back. The tests needing a Unix-only capability —
      # a mode-000 path, a symlink, a non-UTF-8 name — are `cfg(unix)`.
      - name: Test context
        run: cargo test --locked -p harkness-context
      - name: Test runtime
        run: cargo test --locked -p harkness-runtime
      # The shared JSON-RPC transport is where every ACP agent and MCP server
      # gets spawned, framed, and torn down. Its subprocess tests are Unix-only,
      # because `Fixture::shim` writes a `#!/bin/sh` script — the same reason
      # `harkness-git`'s runner tests are. What the Windows leg carries is the
      # platform-independent half plus the one check that genuinely differs
      # there: `SpawnSpec` refuses a program that is not absolute, and
      # `/usr/bin/agent` is rooted but *not* absolute on Windows.
      - name: Test transport
        run: cargo test --locked -p harkness-transport
      # The provider boundary is hermetic by construction — no network, no
      # credential, and no wall clock in its scenarios — so every leg of the
      # matrix runs all of it. The
      # frozen script fixtures are compared byte for byte against a pretty
      # encoding that emits `\n`, which is what the `.gitattributes` entry for
      # their directory is for: without it this is the job that fails on
      # Windows and nowhere else.
      - name: Test provider
        run: cargo test --locked -p harkness-provider
      # The v0.5 adapter crates are skeletons, so what these run is the ADR-0009
      # layering assertion each one makes about its own manifest. That check is
      # worth a matrix entry now precisely because the crates are empty: the
      # dependency direction is the only thing they currently have to get wrong.
      - name: Test ACP adapter
        run: cargo test --locked -p harkness-acp
      - name: Test MCP adapter
        run: cargo test --locked -p harkness-mcp
      - name: Test forge adapter
        run: cargo test --locked -p harkness-forge
      - name: Test recipes
        run: cargo test --locked -p harkness-recipe
      - name: Test shared fixtures
        run: cargo test --locked -p harkness-test-fixtures
      - name: Test CLI
        run: cargo test --locked -p harkness-cli

  # Latency targets are `#[ignore]`d because a debug build measures nothing
  # meaningful. Running them nowhere leaves the numbers unverified, so the named
  # ones run here in release, by exact name: a bare `--ignored` sweep would also
  # run the fixture regenerators, which rewrite committed files.
  latency:
    name: Latency targets (release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      # v0.3 puts policy evaluation on every protected tool call, so its 5 ms
      # budget is a release requirement rather than a note in the issue.
      - name: Measure policy evaluation
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          policy::tests::policy_evaluation_meets_the_latency_target
          --release
      - name: Measure registry lookup
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          tool::tests::registry_lookup_meets_the_latency_target
          --release
      # Issue #94 makes per-call dispatch overhead a release requirement, so it
      # belongs here for the same reason the two above do: an `#[ignore]`d
      # benchmark named by no job runs in no profile on no platform, and its
      # numbers stay unverified.
      - name: Measure read-tool dispatch overhead
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          tools::read_tests::registry_lookup_and_dispatch_overhead_stay_within_issue_budgets
          --release
      # Issue #111 budgets streaming assembly at ten microseconds per event,
      # which every token of every model turn pays, so it belongs here for the
      # same reason the others do.
      - name: Measure streaming assembly overhead
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-provider
          assemble::assembler::tests::event_dispatch_meets_the_latency_target
          --release
      # Issue #112 budgets a medium repository's inventory walk at 1.5 seconds,
      # and every retrieval feature waits behind it, so it belongs here for the
      # same reason the others do.
      - name: Measure inventory walk
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-context
          inventory::tests::a_medium_repository_meets_the_walk_latency_target
          --release
      # Issue #97 puts the coordinator on every protected tool call, so its
      # per-call budget is a release requirement too.
      - name: Measure coordinator decision-to-dispatch
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          coordinator::tests::approval_decision_to_tool_dispatch_stays_below_ten_milliseconds
          --release
      # Issue #94 budgets the executor's own per-call overhead, measured where
      # no subscriber is installed. That is not the arrangement Harkness ships,
      # which is why the next step exists as well as this one: `tracing` is
      # close to free until something is listening.
      - name: Measure executor per-call overhead
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          tool::execution_tests::executor_overhead_per_call_meets_the_latency_target
          --release
      # The same budget under the subscriber that actually ships — JSON
      # formatter, redacting writer, rotating file — which is the number a user
      # pays.
      - name: Measure per-call overhead under the shipped subscriber
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          per_call_overhead_stays_inside_the_budget_with_the_subscriber_installed
          --release
      # Issue #104 budgets the four store operations every surface waits behind:
      # the two writes a state change pays for, the listing a runs panel opens
      # with, and the timeline a run detail page loads. An unwired budget is an
      # unverified one, which is the whole reason these are named here.
      - name: Measure state-change persistence
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          store::tests::persisting_a_state_change_batch_meets_the_latency_target
          --release
      - name: Measure state-change persistence with its events
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          store::tests::persisting_a_state_change_batch_with_its_events_meets_the_latency_target
          --release
      - name: Measure listing one hundred runs
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          store::tests::listing_one_hundred_runs_meets_the_latency_target
          --release
      - name: Measure loading a thousand-event run
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          store::tests::loading_a_thousand_event_run_meets_the_latency_target
          --release
      # Cancellation is a promise to whoever pressed the button, and it is kept
      # by two different chains: a tool noticing its token, and a child being
      # killed through its process group. 250 ms covers both, so both are timed.
      - name: Measure cooperative cancellation
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          tool::execution_tests::cancellation_latency_meets_the_target
          --release
      - name: Measure child-process cancellation
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-runtime
          schedule::tests::processes::cancelling_a_run_stops_a_cooperative_child_within_the_promised_latency
          --release

  github-remote-import:
    name: GitHub remote import
    runs-on: [self-hosted, Linux, X64, harkness]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
      - name: Test GitHub remote import deduplication
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-core
          project::tests::github_remote_forms_deduplicate_through_import
      # Every other synchronizing test uses a local remote, which exercises no
      # credential helper at all. This is the only coverage proving a real
      # remote is still reached through the generalized runner.
      - name: Test GitHub fetch and pull round trip
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-git
          sync::tests::github_fetch_and_pull_round_trip
      # The default-branch guardrail asks the remote which branch it currently
      # calls its default, so it needs one real hosting service to have answered
      # at least once. It writes nothing: the push it refuses never runs.
      - name: Test GitHub default branch refusal
        run: >-
          sh .github/scripts/run-ignored-exact-test.sh
          harkness-git
          sync::tests::github_default_branch_refusal_asks_the_remote
